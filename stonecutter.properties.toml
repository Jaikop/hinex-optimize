["26.2"]
# Releases marked compatible on Modrinth / CurseForge
mod.mc_releases = ["26.2"]

[fabric."26.2"]
# Compatibility range written into fabric.mod.json / neoforge.mods.toml
mod.mc_compat = "~26.2"
deps.fabric_api = "0.161.0+26.2"

[neoforge."26.2"]
mod.mc_compat = "[26.2, 26.3)"
deps.neo_loader = "26.2.0.93"


["26.3"]
mod.mc_releases = ["26.3"]

[fabric."26.3"]
mod.mc_compat = "~26.3"
deps.fabric_api = "0.163.0+26.3"

[neoforge."26.3"]
mod.mc_compat = "[26.3, 26.4)"
deps.neo_loader = "26.3.0.84"


["26.4"]
# Snapshot: the node's logical version is 26.4, the game jar comes from this id
deps.minecraft = "26.4-snapshot-4"
mod.mc_releases = ["26.4-snapshot-4"]

[fabric."26.4"]
# Fabric Loader normalizes "26.4-snapshot-4" to "26.4-alpha.4"
mod.mc_compat = "26.4-alpha.4"
deps.fabric_api = "0.163.0+26.4"
