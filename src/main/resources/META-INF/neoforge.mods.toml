license = "LGPL-3.0-only"
issueTrackerURL = "https://github.com/Jaikop/hinex-optimize/issues"

modLoader = "javafml"
loaderVersion = "[1,)"

[[mods]]
modId = "${id}"
displayName = "${name}"
version = "${version}"
authors = "JAKOP"
displayURL = "https://github.com/Jaikop/hinex-optimize"
logoFile = "assets/hinexoptimize/icon.png"
description = '''
Changes the render distance without rebuilding every chunk, so the world never disappears, and can lower it automatically to keep your FPS. Built for the new Vulkan-era renderer.
Source: https://github.com/Jaikop/hinex-optimize
'''

[[mixins]]
config = "hinexoptimize.mixins.json"

[[dependencies.${id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft}"
ordering = "NONE"
side = "BOTH"
